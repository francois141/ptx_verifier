[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
volta_amd_analysis = { path = "./crates/volta_amd_analysis" }
volta_common = { path = "./crates/volta_common" }
volta_equivalence = { path = "./crates/volta_equivalence" }
volta_expr = { path = "./crates/volta_expr" }
volta_graph = { path = "./crates/volta_graph" }
volta_graph_check = { path = "./crates/volta_graph_check" }
volta_pipeline = { path = "./crates/volta_pipeline" }
volta_ptx_analysis = { path = "./crates/volta_ptx_analysis" }
volta_spec = { path = "./crates/volta_spec" }
volta_trainium_analysis = { path = "./crates/volta_trainium_analysis" }
volta_viz = { path = "./crates/volta_viz" }

anyhow = "1.0"
ansi_term = "0.12.1"
bincode = "1.3"
clap = { version = "4.5.54", features = ["derive"] }
id_collections = { version = "1.0.1", features = ["serde"] }
rug = { version = "1.30", default-features = false, features = ["rational", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
textwrap = "0.16.2"
log = "0.4"
env_logger = "0.11"
stacker = "0.1"

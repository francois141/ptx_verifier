[package]
name = "volta_z3"
version.workspace = true
edition.workspace = true
description = "Z3 backend for verification-condition equivalence checking, for timing comparison against volta_equivalence::canon's decision procedure. Generates SMT-LIB2 and evaluates it via libz3's C API in a killable worker subprocess (hand-written minimal FFI; requires libz3-dev to build, no bindgen)."

[dependencies]
volta_equivalence.workspace = true
volta_expr.workspace = true
stacker.workspace = true
thiserror.workspace = true

[dev-dependencies]
ctor = "0.2"
volta_analysis.workspace = true
volta_frontend.workspace = true

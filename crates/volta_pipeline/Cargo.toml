[package]
name = "volta_pipeline"
version.workspace = true
edition.workspace = true
autotests = false

[features]
default = []
logging = ["dep:log"]  # Full logging when enabled

[dependencies]
log = { workspace = true, optional = true }
rug.workspace = true
volta_amd_analysis.workspace = true
volta_common.workspace = true
volta_equivalence.workspace = true
volta_expr.workspace = true
volta_graph.workspace = true
volta_graph_check.workspace = true
volta_ptx_analysis.workspace = true
volta_spec.workspace = true
volta_trainium_analysis.workspace = true

[dev-dependencies]
volta_trainium_analysis.workspace = true
volta_viz.workspace = true

[[test]]
name = "ptx_tests"
path = "tests/ptx/main.rs"

[[test]]
name = "amd_tests"
path = "tests/amd/main.rs"

[[test]]
name = "trainium_tests"
path = "tests/trainium/main.rs"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta Event Graphs</title>
<style>/*{{style}}*/</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" class="logo-bg"/>
        <path d="M8 4.5v15M16 4.5v15" class="logo-lane"/>
        <path d="M8 8.5l8 7" class="logo-edge"/>
        <circle cx="8" cy="8.5" r="2.3" class="logo-node"/>
        <circle cx="16" cy="15.5" r="2.3" class="logo-node"/>
      </svg>
      <span class="brand-name">Volta</span>
      <span class="brand-sub">event graphs</span>
      <button id="theme-toggle" class="btn icon ghost" type="button"></button>
    </div>
    <label class="search">
      <input id="test-filter" type="search" placeholder="Filter tests" autocomplete="off" spellcheck="false" aria-label="Filter tests">
      <kbd>/</kbd>
    </label>
    <div id="status-filter" class="status-filter"></div>
    <nav id="test-list" aria-label="Recorded runs"></nav>
    <div class="sidebar-foot">
      <span id="sidebar-foot"></span>
      <button id="help-toggle" class="btn small ghost" type="button">Shortcuts <kbd>?</kbd></button>
    </div>
  </aside>
  <main id="main" class="no-graph">
    <header id="run-header"></header>
    <div id="toolbar"></div>
    <div id="focus-bar" hidden></div>
    <div id="canvas-wrap">
      <canvas id="graph" aria-label="Event graph"></canvas>
      <div id="canvas-message" hidden></div>
      <div id="empty-state" hidden></div>
      <div id="legend" class="overlay" hidden></div>
      <div id="minimap-box" class="overlay" hidden><canvas id="minimap" aria-label="Overview of the whole graph"></canvas></div>
      <div id="view-controls" class="overlay" hidden></div>
      <div id="tooltip" hidden></div>
    </div>
  </main>
  <section id="inspector" aria-label="Inspector">
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="checks" type="button">Checks<span class="tab-badge" id="badge-checks"></span></button>
      <button class="tab" role="tab" data-tab="event" type="button">Event<span class="tab-badge" id="badge-event"></span></button>
      <button class="tab" role="tab" data-tab="source" type="button">Source<span class="tab-badge" id="badge-source"></span></button>
    </div>
    <div id="tab-checks" class="tab-body"></div>
    <div id="tab-event" class="tab-body" hidden></div>
    <div id="tab-source" class="tab-body" hidden></div>
  </section>
</div>
<div id="help" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="modal-head">
      <h2 id="help-title">Keyboard and mouse</h2>
      <button id="help-close" class="btn icon ghost" type="button" aria-label="Close"></button>
    </div>
    <div id="help-body"></div>
  </div>
</div>
<!--{{runs}}-->
<script>/*{{script}}*/</script>
</body>
</html>
